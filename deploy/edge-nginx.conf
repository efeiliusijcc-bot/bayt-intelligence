pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  server_tokens off;
  client_max_body_size 64m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $arg_token $collector_console_token {
    "" $cookie_bayt_collector_console;
    default $arg_token;
  }

  map $arg_token $collector_console_cookie {
    "" "";
    default "bayt_collector_console=$arg_token; Path=/collector-console/; Max-Age=900; Secure; HttpOnly; SameSite=Strict";
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/edge-certs/cert.pem;
    ssl_certificate_key /etc/nginx/edge-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    location = /_collector_auth {
      internal;
      proxy_pass http://bayt-intelligence:4180/api/v1/collector/console-auth?token=$collector_console_token;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    location /collector-console/ {
      auth_request /_collector_auth;
      add_header Set-Cookie $collector_console_cookie;
      rewrite ^/collector-console/(.*)$ /$1 break;
      proxy_pass http://bayt-collector-worker:6080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://bayt-intelligence:4180;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
